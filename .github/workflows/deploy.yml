# Каждый git push в main: тесты → Supabase (база + сервер) → GitHub Pages → кнопка бота.
# Секреты задаются один раз: Settings → Secrets and variables → Actions в Settings → Secrets and variables → Actions.
name: Публикация Kinpass

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kinpass-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}mini.html
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Проверить секреты
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=0
          for name in BOT_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::Нет секрета $name. Добавь: Settings → Secrets and variables → Actions"; missing=1; fi
          done
          if ! [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]]; then echo "::error::SUPABASE_PROJECT_REF — 20 строчных латинских букв."; missing=1; fi
          exit $missing

      - name: Установить зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Адрес приложения
        id: site
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          origin="https://${owner}.github.io"
          if [ "${repo,,}" = "${owner}.github.io" ]; then path=""; else path="/${repo}"; fi
          echo "origin=${origin}" >> "$GITHUB_OUTPUT"
          # ?v=<commit> makes Telegram load the fresh page after every deploy (Pages caches for 10 min).
          echo "mini=${origin}${path}/mini.html?v=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Supabase — база данных и сервер
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          APP_ORIGIN: ${{ steps.site.outputs.origin }}
          MINI_APP_URL: ${{ steps.site.outputs.mini }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          # On failure the last CLI lines go to the run summary (secrets are masked by GitHub).
          sb() { local out; if ! out=$(npx supabase "$@" 2>&1); then echo "$out"; echo "::error title=supabase $1 $2::$(printf '%s' "$out" | tail -n 6 | tr '\n' ' ' | cut -c1-900)"; exit 1; fi; echo "$out"; }
          sb link --project-ref "$SUPABASE_PROJECT_REF"
          sb db push --yes
          umask 077
          secrets_file="$RUNNER_TEMP/function.env"
          printf 'BOT_TOKEN=%s\nAPP_ORIGIN=%s\nMINI_APP_URL=%s\n' "$BOT_TOKEN" "$APP_ORIGIN" "$MINI_APP_URL" > "$secrets_file"
          # Optional AI helper: institution lookup + answers in the bot (Gemini API key from aistudio.google.com).
          if [ -n "$GEMINI_API_KEY" ]; then printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> "$secrets_file"; else echo "::notice::GEMINI_API_KEY не задан — ИИ-помощник выключен."; fi
          if [ -n "$GEMINI_MODEL" ]; then printf 'GEMINI_MODEL=%s\n' "$GEMINI_MODEL" >> "$secrets_file"; fi
          sb secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$secrets_file"
          rm -f "$secrets_file"
          sb functions deploy kinpass-api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          sb functions deploy kinpass-bot --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api

      - name: Проверить сервер
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/kinpass-api"
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 15 "$url" | grep -q '"service":"kinpass-api"'; then echo "Сервер отвечает."; exit 0; fi
            sleep 5
          done
          echo "::error::Сервер kinpass-api не ответил. Supabase → Edge Functions → kinpass-api → Logs."
          exit 1

      - name: Собрать сайт
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Собирает только web/ в dist/ и останавливается, если в файлах найден секрет.
        run: node scripts/launch.mjs --build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Опубликовать на GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Бот — кнопка «Открыть Путь» и ответ на /start
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MINI_URL: ${{ steps.site.outputs.mini }}
        run: |
          telegram() { curl -fsS --max-time 20 -H 'Content-Type: application/json' -d "$2" "https://api.telegram.org/bot${BOT_TOKEN}/$1" | jq -e '.ok == true' > /dev/null; }
          telegram setChatMenuButton "$(jq -n --arg url "$MINI_URL" '{menu_button:{type:"web_app",text:"Открыть Путь",web_app:{url:$url}}}')"
          secret=$(node --input-type=module -e "import { webhookSecret } from './supabase/functions/kinpass-bot/bot.mjs'; console.log(await webhookSecret(process.env.BOT_TOKEN));")
          echo "::add-mask::${secret}"
          hook="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/kinpass-bot"
          telegram setWebhook "$(jq -n --arg url "$hook" --arg secret "$secret" '{url:$url,secret_token:$secret,allowed_updates:["message"]}')"
          echo "Готово: ${MINI_URL}"
